
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#063e3b">
<title>ChatApp | Messages</title>

<style>
:root {
    --primary: #07876e;
    --primary-dark: #056653;
    --dark: #063e3b;
    --accent: #20c99a;
    --light: #e5f5f0;
    --background: #f3f7f7;
    --white: #ffffff;
    --text: #172b35;
    --muted: #788590;
    --border: #e0e9e8;
    --incoming: #eaf1ef;
    --danger: #e74c5b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* =========================
   TOP NAVBAR
========================= */

.navbar {
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 0 24px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(6, 62, 59, 0.04);
    position: relative;
    z-index: 10;
}

.nav-left,
.nav-right,
.nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    color: var(--dark);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.8px;
    white-space: nowrap;
}

.logo span {
    color: var(--primary);
}

.global-search {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 235px;
    padding: 12px 15px;
    border-radius: 25px;
    background: var(--background);
}

.global-search input,
.contact-search input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: var(--text);
}

.nav-links {
    align-self: stretch;
    gap: 5px;
}

.nav-link {
    height: 100%;
    min-width: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    padding: 0 14px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 3px solid transparent;
    transition: 0.2s;
}

.nav-link:hover {
    color: var(--primary-dark);
    background: #f7faf9;
}

.nav-link.active {
    color: var(--primary-dark);
    border-bottom-color: var(--primary);
}

.nav-icon {
    font-size: 19px;
}

.round-button {
    width: 41px;
    height: 41px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: #eaf2f0;
    color: var(--dark);
    cursor: pointer;
    font-size: 18px;
    position: relative;
}

.round-button:hover {
    background: #dcebe7;
}

.avatar {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    background: #d9eee7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
    position: relative;
}

.badge {
    position: absolute;
    top: 8px;
    right: 8px;
    min-width: 17px;
    height: 17px;
    padding: 2px 4px;
    background: var(--danger);
    color: white;
    font-size: 10px;
    border-radius: 20px;
    text-align: center;
}

/* =========================
   NOTIFICATIONS
========================= */

.notification-wrap {
    position: relative;
    height: 100%;
}

.notification-menu {
    display: none;
    position: absolute;
    top: 65px;
    right: -45px;
    width: 320px;
    max-width: calc(100vw - 20px);
    padding: 18px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(6, 62, 59, 0.15);
}

.notification-menu.show {
    display: block;
}

.notification-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.notification-heading h3 {
    font-size: 19px;
}

.notification-item {
    padding: 13px 8px;
    border-bottom: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    line-height: 1.5;
}

.notification-item:last-child {
    border-bottom: none;
}

.notification-item:hover {
    background: var(--background);
}

/* =========================
   MAIN LAYOUT
========================= */

.app {
    display: flex;
    height: calc(100vh - 68px);
}

/* =========================
   CONTACTS PANEL
========================= */

.contacts-panel {
    width: 355px;
    min-width: 300px;
    background: white;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.panel-header {
    padding: 23px 18px 15px;
}

.panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.panel-title h1 {
    color: var(--dark);
    font-size: 27px;
    font-weight: 750;
}

.panel-actions {
    display: flex;
    gap: 8px;
}

.small-button {
    width: 37px;
    height: 37px;
    border: none;
    border-radius: 50%;
    background: #eaf2f0;
    color: var(--dark);
    font-size: 18px;
    cursor: pointer;
}

.small-button:hover {
    background: #dcebe7;
}

.contact-search {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 15px;
    background: var(--background);
    border: 1px solid transparent;
    border-radius: 25px;
}

.contact-search:focus-within {
    border-color: var(--primary);
}

.tabs {
    display: flex;
    gap: 7px;
    padding: 0 14px 13px;
    border-bottom: 1px solid var(--border);
}

.tab {
    padding: 9px 15px;
    border: none;
    border-radius: 22px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.tab:hover {
    background: var(--background);
}

.tab.active {
    color: var(--primary-dark);
    background: var(--light);
}

.contact-list {
    overflow-y: auto;
    padding: 7px;
}

.contact {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 10px;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.15s;
}

.contact:hover {
    background: #f5f8f7;
}

.contact.active {
    background: var(--light);
}

.contact .avatar {
    width: 48px;
    height: 48px;
}

.online-dot {
    width: 12px;
    height: 12px;
    position: absolute;
    right: 0;
    bottom: 0;
    background: var(--accent);
    border: 2px solid white;
    border-radius: 50%;
}

.contact-info {
    flex: 1;
    min-width: 0;
}

.contact-name {
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
}

.contact-preview {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.contact-time {
    align-self: flex-start;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
}

.empty-contacts {
    padding: 30px 15px;
    color: var(--muted);
    text-align: center;
    font-size: 14px;
}

/* =========================
   CHAT PANEL
========================= */

.chat-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: white;
}

.chat-header {
    min-height: 76px;
    padding: 0 23px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
}

.chat-user {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.chat-user-name {
    margin-bottom: 5px;
    font-size: 16px;
    font-weight: 700;
    color: var(--dark);
}

.chat-status {
    color: var(--muted);
    font-size: 12px;
}

.chat-status.online {
    color: var(--primary);
}

.chat-tools {
    display: flex;
    align-items: center;
    gap: 17px;
}

.chat-tools button {
    border: none;
    background: transparent;
    color: var(--primary);
    font-size: 21px;
    cursor: pointer;
}

.chat-tools button:hover {
    color: var(--dark);
}

.mobile-back {
    display: none;
    border: none;
    background: transparent;
    color: var(--primary-dark);
    font-size: 23px;
    cursor: pointer;
}

/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 25px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background:
        radial-gradient(
            circle at top right,
            rgba(32, 201, 154, 0.045),
            transparent 38%
        ),
        #ffffff;
}

.conversation-start {
    margin: auto 0 20px;
    padding: 20px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

.conversation-start strong {
    color: var(--dark);
}

.message-row {
    max-width: 75%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
}

.message-row.mine {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message-row.theirs {
    align-self: flex-start;
}

.message-avatar {
    width: 29px;
    height: 29px;
    border-radius: 50%;
    background: #d9eee7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}

.message-content {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.bubble {
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.mine .bubble {
    color: white;
    background: linear-gradient(110deg, #056653, #07876e);
    border-bottom-right-radius: 5px;
}

.theirs .bubble {
    color: var(--text);
    background: var(--incoming);
    border-bottom-left-radius: 5px;
}

.message-time {
    margin: 4px 8px 0;
    color: var(--muted);
    font-size: 10px;
}

.mine .message-time {
    text-align: right;
}

/* =========================
   MESSAGE INPUT
========================= */

.chat-footer {
    padding: 15px 22px;
    display: flex;
    align-items: center;
    gap: 13px;
    border-top: 1px solid var(--border);
    background: white;
}

.footer-action {
    border: none;
    background: transparent;
    color: var(--primary);
    font-size: 23px;
    cursor: pointer;
}

.message-input {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 13px 6px 18px;
    background: var(--background);
    border: 1px solid transparent;
    border-radius: 26px;
}

.message-input:focus-within {
    border-color: #a4d7c8;
}

.message-input input {
    flex: 1;
    min-width: 0;
    padding: 9px 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
}

.message-input input::placeholder {
    color: var(--muted);
}

.send-button {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.send-button:hover {
    background: var(--dark);
    transform: scale(1.04);
}

.hidden {
    display: none !important;
}

/* =========================
   SCROLLBARS
========================= */

.contact-list::-webkit-scrollbar,
.messages::-webkit-scrollbar {
    width: 6px;
}

.contact-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb {
    background: #d4e2dd;
    border-radius: 10px;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 900px) {
    .navbar {
        padding: 0 13px;
        gap: 8px;
    }

    .global-search {
        display: none;
    }

    .nav-link {
        min-width: 65px;
        padding: 0 9px;
    }

    .nav-link span:not(.nav-icon) {
        display: none;
    }

    .contacts-panel {
        width: 315px;
        min-width: 270px;
    }
}

@media (max-width: 600px) {
    body {
        overflow: hidden;
    }

    .navbar {
        height: 60px;
        padding: 0 10px;
        gap: 5px;
    }

    .logo {
        font-size: 19px;
    }

    .nav-left,
    .nav-right {
        gap: 5px;
    }

    .nav-links {
        gap: 0;
    }

    .nav-link {
        min-width: 37px;
        padding: 0 7px;
    }

    .nav-icon {
        font-size: 18px;
    }

    .nav-right .round-button {
        display: none;
    }

    .nav-right .avatar {
        width: 34px;
        height: 34px;
        font-size: 18px;
    }

    .notification-menu {
        right: -60px;
        top: 58px;
    }

    .app {
        height: calc(100vh - 60px);
    }

    .contacts-panel {
        width: 100%;
        min-width: 0;
        border-right: none;
    }

    .chat-panel {
        display: none;
        width: 100%;
    }

    .app.chat-open .contacts-panel {
        display: none;
    }

    .app.chat-open .chat-panel {
        display: flex;
    }

    .panel-header {
        padding: 17px 14px 12px;
    }

    .panel-title h1 {
        font-size: 24px;
    }

    .mobile-back {
        display: inline-block;
    }

    .chat-header {
        min-height: 66px;
        padding: 0 10px;
        gap: 5px;
    }

    .chat-user {
        gap: 7px;
    }

    .chat-user .avatar {
        width: 37px;
        height: 37px;
        font-size: 19px;
    }

    .chat-user-name {
        font-size: 14px;
    }

    .chat-tools {
        gap: 10px;
    }

    .chat-tools button {
        font-size: 18px;
    }

    .messages {
        padding: 15px 10px;
        gap: 10px;
    }

    .message-row {
        max-width: 90%;
    }

    .bubble {
        padding: 10px 13px;
        font-size: 13px;
    }

    .chat-footer {
        padding: 10px;
        gap: 8px;
    }

    .chat-footer > .footer-action {
        display: none;
    }

    .send-button {
        width: 37px;
        height: 37px;
    }
}
</style>
</head>

<body>

<!-- TOP NAVIGATION -->
<nav class="navbar">
    <div class="nav-left">
        <div class="logo">💬 Chat<span>App</span></div>

        <div class="global-search">
            <span>⌕</span>
            <input type="text" id="globalSearch"
                   placeholder="Search ChatApp">
        </div>
    </div>

    <div class="nav-links">
        <a href="chat.html" class="nav-link">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a href="messages.html" class="nav-link active">
            <span class="nav-icon">▣</span>
            <span>Messages</span>
        </a>

        <div class="notification-wrap">
            <button class="nav-link" id="notificationButton"
                    type="button" aria-label="Notifications"
                    aria-expanded="false">
                <span class="nav-icon">♧</span>
                <span>Notifications</span>
                <span class="badge" id="notificationBadge">2</span>
            </button>

            <div class="notification-menu" id="notificationMenu">
                <div class="notification-heading">
                    <h3>Notifications</h3>
                    <button class="small-button" id="markReadButton"
                            type="button" title="Mark all as read">✓</button>
                </div>

                <div id="notificationList">
                    <div class="notification-item">
                        💬 <strong>Alex Johnson</strong> sent you a message.
                    </div>
                    <div class="notification-item">
                        🟢 <strong>Maria Santos</strong> is online.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-right">
        <button class="round-button" type="button" title="Settings"
                id="settingsButton">⚙</button>
        <div class="avatar" title="My profile">👤</div>
    </div>
</nav>

<!-- MAIN CHAT APPLICATION -->
<div class="app" id="app">

    <!-- CONVERSATION LIST -->
    <aside class="contacts-panel">
        <div class="panel-header">
            <div class="panel-title">
                <h1>Messages</h1>

                <div class="panel-actions">
                    <button class="small-button" id="newChatButton"
                            type="button" title="New conversation">✎</button>

                    <button class="small-button" id="moreButton"
                            type="button" title="More options">•••</button>
                </div>
            </div>

            <div class="contact-search">
                <span>⌕</span>
                <input type="text" id="searchContacts"
                       placeholder="Search conversations">
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-filter="all" type="button">All</button>
            <button class="tab" data-filter="unread" type="button">Unread</button>
            <button class="tab" data-filter="online" type="button">Online</button>
        </div>

        <div class="contact-list" id="contactList"></div>
    </aside>

    <!-- CHAT WINDOW -->
    <main class="chat-panel">
        <header class="chat-header">
            <div class="chat-user">
                <button class="mobile-back" id="mobileBack"
                        type="button" aria-label="Back to conversations">←</button>

                <div class="avatar" id="headerAvatar">👨🏻</div>

                <div>
                    <div class="chat-user-name" id="headerName">Alex Johnson</div>
                    <div class="chat-status" id="headerStatus">Active now</div>
                </div>
            </div>

            <div class="chat-tools">
                <button type="button" id="voiceCallButton"
                        title="Voice call">☎</button>
                <button type="button" id="videoCallButton"
                        title="Video call">▣</button>
                <button type="button" id="infoButton"
                        title="Conversation information">ⓘ</button>
            </div>
        </header>

        <section class="messages" id="messages"
                 aria-live="polite" aria-label="Conversation messages"></section>

        <form class="chat-footer" id="messageForm">
            <button class="footer-action" type="button"
                    id="attachmentButton" title="Attachments">＋</button>

            <div class="message-input">
                <input type="text" id="messageInput"
                       placeholder="Type a message..."
                       autocomplete="off" aria-label="Type a message">

                <button type="button" class="footer-action"
                        id="emojiButton" title="Add emoji">☺</button>
            </div>

            <button type="submit" class="send-button"
                    title="Send message" aria-label="Send message">➤</button>
        </form>
    </main>
</div>

<script>
const app = document.getElementById("app");
const contactList = document.getElementById("contactList");
const messagesElement = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const messageForm = document.getElementById("messageForm");
const searchInput = document.getElementById("searchContacts");
const notificationMenu = document.getElementById("notificationMenu");
const notificationButton = document.getElementById("notificationButton");
const notificationBadge = document.getElementById("notificationBadge");

let activeChatId = 1;
let currentFilter = "all";
let unreadNotifications = 2;

const contacts = [
    {
        id: 1,
        name: "Alex Johnson",
        avatar: "👨🏻",
        online: true,
        unread: false,
        preview: "I'm doing great, thanks!",
        time: "10:33 AM",
        messages: [
            { text: "Hey there! 👋", mine: false, time: "10:30 AM" },
            { text: "Hi Alex! How are you?", mine: true, time: "10:31 AM" },
            { text: "I'm good! How about you?", mine: false, time: "10:32 AM" },
            { text: "I'm doing great, thanks!", mine: true, time: "10:33 AM" }
        ]
    },
    {
        id: 2,
        name: "Maria Santos",
        avatar: "👩🏻",
        online: true,
        unread: true,
        preview: "See you tomorrow!",
        time: "9:45 AM",
        messages: [
            { text: "Are we still meeting tomorrow?", mine: false, time: "9:40 AM" },
            { text: "Yes! See you tomorrow 😊", mine: true, time: "9:45 AM" }
        ]
    },
    {
        id: 3,
        name: "John Smith",
        avatar: "👨🏽",
        online: false,
        unread: false,
        preview: "Thanks for your help!",
        time: "Yesterday",
        messages: [
            { text: "Could you help me with the project?", mine: false, time: "Yesterday" },
            { text: "Of course! Happy to help.", mine: true, time: "Yesterday" },
            { text: "Thanks for your help!", mine: false, time: "Yesterday" }
        ]
    },
    {
        id: 4,
        name: "Sarah Williams",
        avatar: "👩🏽",
        online: false,
        unread: false,
        preview: "That sounds great!",
        time: "Yesterday",
        messages: [
            { text: "Let's catch up this weekend.", mine: true, time: "Yesterday" },
            { text: "That sounds great!", mine: false, time: "Yesterday" }
        ]
    },
    {
        id: 5,
        name: "David Lee",
        avatar: "👨🏻‍💻",
        online: true,
        unread: false,
        preview: "Send me the details.",
        time: "Monday",
        messages: [
            { text: "I'll send you the details soon.", mine: true, time: "Monday" },
            { text: "Send me the details.", mine: false, time: "Monday" }
        ]
    }
];

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function getActiveContact() {
    return contacts.find(contact => contact.id === activeChatId);
}

function updateNotificationBadge() {
    notificationBadge.textContent = unreadNotifications;
    notificationBadge.style.display =
        unreadNotifications > 0 ? "inline-block" : "none";
}

function renderContacts() {
    const query = searchInput.value.toLowerCase().trim();

    const filtered = contacts.filter(contact => {
        const matchesSearch = contact.name.toLowerCase().includes(query);

        const matchesFilter =
            currentFilter === "all" ||
            (currentFilter === "unread" && contact.unread) ||
            (currentFilter === "online" && contact.online);

        return matchesSearch && matchesFilter;
    });

    if (!filtered.length) {
        contactList.innerHTML =
            '<div class="empty-contacts">No conversations found.</div>';
        return;
    }

    contactList.innerHTML = filtered.map(contact => `
        <div class="contact ${contact.id === activeChatId ? "active" : ""}"
             data-id="${contact.id}" role="button" tabindex="0">
            <div class="avatar">
                ${escapeHTML(contact.avatar)}
                ${contact.online ? '<span class="online-dot"></span>' : ""}
            </div>

            <div class="contact-info">
                <div class="contact-name">${escapeHTML(contact.name)}</div>
                <div class="contact-preview">
                    ${contact.unread ? "<strong>New message · </strong>" : ""}
                    ${escapeHTML(contact.preview)}
                </div>
            </div>

            <div class="contact-time">${escapeHTML(contact.time)}</div>
        </div>
    `).join("");
}

function renderMessages() {
    const contact = getActiveContact();
    if (!contact) return;

    document.getElementById("headerName").textContent = contact.name;
    document.getElementById("headerAvatar").textContent = contact.avatar;

    const status = document.getElementById("headerStatus");
    status.textContent = contact.online ? "Active now" : "Offline";
    status.classList.toggle("online", contact.online);

    const start = `
        <div class="conversation-start">
            <strong>${escapeHTML(contact.name)}</strong><br>
            This is the beginning of your conversation.
        </div>
    `;

    const conversation = contact.messages.map(message => `
        <div class="message-row ${message.mine ? "mine" : "theirs"}">
            ${message.mine ? "" : `
                <div class="message-avatar">${escapeHTML(contact.avatar)}</div>
            `}
            <div class="message-content">
                <div class="bubble">${escapeHTML(message.text)}</div>
                <div class="message-time">${escapeHTML(message.time)}</div>
            </div>
        </div>
    `).join("");

    messagesElement.innerHTML = start + conversation;
    messagesElement.scrollTop = messagesElement.scrollHeight;
}

function openChat(id) {
    activeChatId = id;

    const contact = getActiveContact();
    if (contact) {
        contact.unread = false;
    }

    renderContacts();
    renderMessages();

    app.classList.add("chat-open");
    messageInput.focus();
}

contactList.addEventListener("click", event => {
    const element = event.target.closest(".contact");
    if (element) openChat(Number(element.dataset.id));
});

contactList.addEventListener("keydown", event => {
    const element = event.target.closest(".contact");
    if (element && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openChat(Number(element.dataset.id));
    }
});

searchInput.addEventListener("input", renderContacts);

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(item =>
            item.classList.remove("active")
        );

        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        renderContacts();
    });
});

document.getElementById("globalSearch").addEventListener("input", event => {
    searchInput.value = event.target.value;
    renderContacts();
});

messageForm.addEventListener("submit", event => {
    event.preventDefault();

    const text = messageInput.value.trim();
    if (!text) return;

    const contact = getActiveContact();
    if (!contact) return;

    const now = new Date();
    const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    contact.messages.push({
        text,
        mine: true,
        time
    });

    contact.preview = text;
    contact.time = time;
    contact.unread = false;

    messageInput.value = "";

    renderMessages();
    renderContacts();
    messageInput.focus();
});

document.getElementById("mobileBack").addEventListener("click", () => {
    app.classList.remove("chat-open");
});

notificationButton.addEventListener("click", event => {
    event.stopPropagation();

    const isOpen = notificationMenu.classList.toggle("show");
    notificationButton.setAttribute("aria-expanded", String(isOpen));
});

document.addEventListener("click", event => {
    if (!event.target.closest(".notification-wrap")) {
        notificationMenu.classList.remove("show");
        notificationButton.setAttribute("aria-expanded", "false");
    }
});

document.getElementById("markReadButton").addEventListener("click", () => {
    unreadNotifications = 0;
    updateNotificationBadge();
});

document.getElementById("emojiButton").addEventListener("click", () => {
    messageInput.value += " 😊";
    messageInput.focus();
});

document.getElementById("newChatButton").addEventListener("click", () => {
    const name = prompt("Enter the contact's name:");
    if (!name || !name.trim()) return;

    const cleanName = name.trim();

    const existing = contacts.find(
        contact => contact.name.toLowerCase() === cleanName.toLowerCase()
    );

    if (existing) {
        openChat(existing.id);
        return;
    }

    const newContact = {
        id: Math.max(0, ...contacts.map(contact => contact.id)) + 1,
        name: cleanName,
        avatar: "👤",
        online: false,
        unread: false,
        preview: "Start a conversation",
        time: "Now",
        messages: []
    };

    contacts.unshift(newContact);

    searchInput.value = "";
    currentFilter = "all";

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.filter === "all");
    });

    openChat(newContact.id);
});

document.getElementById("moreButton").addEventListener("click", () => {
    alert("More conversation options coming soon.");
});

document.getElementById("settingsButton").addEventListener("click", () => {
    alert("Settings page coming soon.");
});

document.getElementById("voiceCallButton").addEventListener("click", () => {
    alert("Voice calling needs a calling service or backend integration.");
});

document.getElementById("videoCallButton").addEventListener("click", () => {
    alert("Video calling needs a calling service or backend integration.");
});

document.getElementById("infoButton").addEventListener("click", () => {
    const contact = getActiveContact();
    if (contact) {
        alert("Conversation with " + contact.name);
    }
});

document.getElementById("attachmentButton").addEventListener("click", () => {
    alert("File sharing can be added using a file upload and backend.");
});

// Initial render
renderContacts();
renderMessages();
updateNotificationBadge();
</script>

</body>
</html>
